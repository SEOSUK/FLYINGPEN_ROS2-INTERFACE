robot_types:
  cf21:
    firmware_params:
      su_wrench:
        mass: 0.045000  # observer mass model [kg]
        mobLPF: 1.0  # [Hz], shared critically damped force/torque MOB and matched-filter frequency
        rOffX: 0.075
        rOffY: 0.0
        rOffZ: 0.01
        comOffX: -0.000440  # body-frame CoM offset x [m]
        comOffY: -0.000234  # body-frame CoM offset y [m]
        comOffZ: 0.0  # body-frame CoM offset z [m]
      imu_sensors:
        accTrimRoll: -0.378620
        accTrimPitch: 0.149601

      su_position:
        # 힘제어 쪽
        preloadEn: 1  # 0: velocity-mode yaw follows server command, 1: velocity-mode yaw aligns to estimated normal direction
        preloadGf: 7.5  # effective gain from normal force error to normal velocity command
        preloadGv: 0.11  # effective gain from normal velocity leakage to command
        preloadNu: 0.30  # [m/s], symmetric saturation bound for normal velocity command
        # 노멀 추정기 쪽
        normBeta: 3.5  # (normal이 굼뜨면 베타 올려) [1/s] beta ≈ 2*pi*f_c, decay rate of the normal-axis memory matrix
        normGamma: 3.0  # (너무 예민하면 감마낮춰)[1/s] normal-estimate tracking gain
        normEpsV: 0.0004  # [m^2/s^2], velocity-projection regularization epsilon_v
        normEpsF: 0.005  # [N], minimum force evidence norm epsilon_f
        # velocity modulation 쪽
        velModEn: 1  # 0: disabled, 1: manual tangential velocity modulation enabled
        velModABar: 0.009  # [m/s^2], geometry-induced normal acceleration bound
        velModVMin: 0.01  # [m/s], minimum contact speed for curvature update
        contactVelLPF: 1.0  # (velocity modulation에도 쓰고 normal estimation에도 씀.) [Hz], shared contact-velocity LPF cutoff
        velModNDotLPF: 1.0  # [Hz], normal-derivative LPF cutoff for curvature estimation
        velModKLPF: 1.0  # [Hz], curvature-estimate LPF cutoff

    # RViz reference surface only; these values are not sent to the firmware.
    rviz_geometry:
      enabled: true
      origin: [1.31838, -0.00053, 0.85842] # [m], lower endpoint fitted from 20261023_022711
      plane_inclinations_deg: [-23.0, 0.0, 21.0] # lower/middle/upper from horizontal
      plane_lengths: [0.052901, 0.232250, 0.195486] # [m], lower/middle/upper
      curve_radius: 0.810816               # [m], common blend radius
      height_half_span: 0.20               # [m], extrusion half-width along world Y
      alpha: 0.22                         # [-], surface transparency

shared_defaults:
  command_reference: end_effector
