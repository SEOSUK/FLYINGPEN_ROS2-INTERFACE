command_publisher:
  ros__parameters:
    position_tick: [0.06, 0.06, 0.06]
    velocity_tick: [0.06, 0.06, 0.06]
    yaw_tick_deg: 2.0
    force_tick: 0.024
    # g-key automatic surface trajectory 1번실험용
    auto_approach_speed: 0.12       # [m/s], sequential approach and X/Z return
    auto_target_x: 1.60             # [m], EE contact target
    auto_target_y: 0.02              # [m], EE command Y target
    auto_target_z: 0.87             # [m], EE contact target
    auto_position_tolerance: 0.015  # [m], target transition tolerance
    auto_t2_speed: 0.08             # [m/s], contact-frame t2 command
    auto_contact_settle_sec: 10.0   # [s], wait after automatic i + j
    auto_motion_sec: 7.0            # [s], each upward/downward pass
    auto_second_down_extra_sec: 1.5 # [s], added only to the second downward pass
    auto_wait_sec: 10.0              # [s], wait between passes
    auto_fourth_wait_sec: 10.0      # [s], fourth pause (after first downward pass)
    auto_final_wait_sec: 10.0       # [s], wait after the final downward pass

    # h-key automatic return-crossing trajectory 2번실험용
    h_auto_approach_speed: 0.12     # [m/s], target approach and XYZ return speed
    h_auto_target_x: 0.475           # [m], configurable EE contact target X
    h_auto_target_y: 0.141           # [m], configurable EE contact target Y
    h_auto_target_z: 0.80           # [m], configurable EE contact target Z
    h_position_tolerance: 0.04      # [m], target/captured-XY tolerance per axis
    h_force_command: 0.024          # force command set together with automatic i
    h_contact_settle_sec: 3.0       # [s], wait after automatic i + force command
    h_d_motion_sec: 6.0             # [s], initial d-direction motion
    h_motion_speed: 0.06            # [m/s], base d/a speed; doubles after second return
    h_final_wait_sec: 5.0           # [s], wait after third return before u + home

    # ==================================================
    # Experiment 3: contact-frame square drawing (b key)
    # ==================================================
    # Initial and home positions are end-effector positions [m].
    box_start_x: 0.53
    box_start_y: 0.016
    box_start_z: 0.76
    box_home_x: 0.0
    box_home_y: 0.0
    box_home_z: 0.0

    # Square geometry.
    box_t1_angle_deg: 30.0          # side width; first move opposite t1 to lower-left
    box_height_m: 0.15              # positive World-Z height change

    # Contact-frame tangential commands.
    box_t1_speed: 0.03              # magnitude of firmware t1 coefficient [m/s]
    box_t2_max_speed: 0.03          # saturation for firmware t2 coefficient [m/s]
    box_t2_kp: 1.0                  # P gain [1/s]; too high stays saturated near the target
    box_t2_ki: 0.15                 # I gain [1/s^2], with conditional anti-windup
    box_t2_kd: 0.05                 # D gain [-], applied to filtered height-error rate
    box_t2_integral_limit: 0.05     # integral-state limit [m*s]
    box_t2_derivative_cutoff_hz: 3.0 # first-order D-term low-pass cutoff [Hz]
    box_t1_z_hold_kp: 0.5           # t1-only Boom-tip World-Z hold gain [1/s]
    box_t1_z_hold_vmax: 0.015       # t1-only t2 correction saturation [m/s]
    box_t1_z_hold_deadband: 0.005   # no t2 correction inside this Z error [m]
    box_z_tolerance: 0.015          # Boom-tip height termination tolerance [m]
    box_angle_tolerance_deg: 2.0    # normal-azimuth termination tolerance [deg]
    box_t1_direction_sign: 1.0      # flip if +t1 changes azimuth opposite to expectation

    # Contact initialization.
    box_force_command: 0.024
    box_contact_settle_sec: 4.0

    # Sequential Z -> Y -> X approach and X -> Y -> Z return.
    box_approach_speed: 0.12
    box_return_speed: 0.12
    box_position_tolerance: 0.025

    # Feedback and travel safety limits.
    box_stage_timeout_sec: 35.0
    box_feedback_timeout_sec: 0.75
    box_max_t1_travel_m: 1.0
    box_min_t2_vertical_projection: 0.35
    box_repeat_continuously: true   # keep drawing; press b again to finish current square and return
