command_publisher:
  ros__parameters:
    position_tick: [0.06, 0.06, 0.06]
    velocity_tick: [0.06, 0.06, 0.06]
    yaw_tick_deg: 2.0
    force_tick: 0.024
    # g-key automatic surface trajectory
    auto_approach_speed: 0.12       # [m/s], sequential approach and X/Z return
    auto_target_x: 1.60             # [m], EE contact target
    auto_target_y: 0.02              # [m], EE command Y target
    auto_target_z: 0.87             # [m], EE contact target
    auto_position_tolerance: 0.015  # [m], target transition tolerance
    auto_t2_speed: 0.08             # [m/s], contact-frame t2 command
    auto_contact_settle_sec: 10.0   # [s], wait after automatic i + j
    auto_motion_sec: 7.0            # [s], each upward/downward pass
    auto_second_down_extra_sec: 1.5 # [s], added only to the second downward pass
    auto_wait_sec: 10.0              # [s], wait between passes
    auto_fourth_wait_sec: 10.0      # [s], fourth pause (after first downward pass)
    auto_final_wait_sec: 10.0       # [s], wait after the final downward pass

    # h-key automatic return-crossing trajectory
    h_auto_approach_speed: 0.12     # [m/s], target approach and XYZ return speed
    h_auto_target_x: 0.475           # [m], configurable EE contact target X
    h_auto_target_y: 0.141           # [m], configurable EE contact target Y
    h_auto_target_z: 0.80           # [m], configurable EE contact target Z
    h_position_tolerance: 0.04      # [m], target/captured-XY tolerance per axis
    h_force_command: 0.024          # force command set together with automatic i
    h_contact_settle_sec: 3.0       # [s], wait after automatic i + force command
    h_d_motion_sec: 6.0             # [s], initial d-direction motion
    h_motion_speed: 0.06            # [m/s], base d/a speed; doubles after second return
    h_final_wait_sec: 5.0           # [s], wait after third return before u + home