rviz_visual:
  ros__parameters:
    topic: "/data_logging_msg"
    ee_cmd_topic: "cf2/cf_su_ee_cmd"
    history_sample_period: 1.0
    history_duration: 30.0
    history_frame_axis_scale: 0.05
    wall_pose_topic: "/poses"
    wall_pose_name: "tilted_wall"
    robot_pose_name: "cf2"
    robot_pose_topic: "/cf2/pose"
    # Publish wall markers directly in world to avoid a marker/TF discovery race.
    wall_marker_frame: ""
    wall_scale_x: 0.01
    wall_scale_y: 1.0
    wall_scale_z: 0.6
